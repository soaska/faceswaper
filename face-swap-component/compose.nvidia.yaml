services:
  face-swap-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: nvidia
    environment:
      - DEVICE_TYPE=nvidia
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/temp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu] 