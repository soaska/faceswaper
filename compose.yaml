services:
  telegram-bot-api:
    image: ${TELEGRAM_BOT_API_IMAGE:-aiogram/telegram-bot-api@sha256:af7603382a56586f90c2a597faf56bc082287025be516eff4230330cd1b0457b}
    environment:
      TELEGRAM_LOCAL: "1"
    env_file:
      - .env
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:${TELEGRAM_API_PORT:-8081}:8081"
      - "127.0.0.1:${TELEGRAM_STAT_PORT:-8082}:8082"
    restart: always

  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    volumes:
      - ./data/pocketbase:/pb/pb_data
    environment:
      PB_ADMIN_EMAIL: ${POCKETBASE_LOGIN}
      PB_ADMIN_PASSWORD: ${POCKETBASE_PASSWORD}
    ports:
      - "127.0.0.1:${POCKETBASE_PORT:-8080}:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  face-swap-component:
    build:
      context: ./face-swap-component
      dockerfile: Dockerfile-cuda
    environment:
      DEVICE_TYPE: nvidia
      TEMP_DIR: /temp
      MAX_CONCURRENT_JOBS: "1"
    env_file:
      - .env
    volumes:
      - ./temp/face-media:/temp/media
      - ./data/face-model-cache:/temp/cache
    ports:
      - "127.0.0.1:${FACE_SWAP_PORT:-7860}:7860"
    restart: always
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

  job-manager:
    build:
      context: ./job-manager
      dockerfile: Dockerfile
    environment:
      DOCKER_BUILD: "1"
      TELEGRAM_API: http://telegram-bot-api:8081
      POCKETBASE_URL: http://pocketbase:8080
      FACE_SWAP_URL: http://face-swap-component:7860
      JOB_CACHE_DIR: /temp/job-manager
    env_file:
      - .env
    volumes:
      - ./temp/job-manager:/temp/job-manager
    restart: always
    depends_on:
      pocketbase:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
      face-swap-component:
        condition: service_healthy

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    environment:
      DOCKER_BUILD: "1"
      TELEGRAM_API: http://telegram-bot-api:8081
      POCKETBASE_URL: http://pocketbase:8080
      BOT_CACHE_DIR: /tmp/faceswaper-bot
    env_file:
      - .env
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    restart: always
    depends_on:
      pocketbase:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
