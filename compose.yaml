services:
  # own telegram api server
  # needed to download / upload large files
  # Container link: https://github.com/aiogram/telegram-bot-api
  # Info about limitations: https://core.telegram.org/bots/api#using-a-local-bot-api-server
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    hostname: tgapi
    environment:
      - TELEGRAM_LOCAL=1
    env_file:
      - .env
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
      - "8082:8082" # statistics
    restart: unless-stopped

  pocketbase:
    hostname: pocketbase
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./data/pocketbase:/pb/pb_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  face-swap-component:
    build:
      context: ./face-swap-component
      dockerfile: Dockerfile-cuda
    environment:
      - DEVICE_TYPE=nvidia
    ports:
      - "7860:7860"
    restart: unless-stopped
    volumes:
      - ./temp:/temp
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  job-manager:
    build:
      context: ./job-manager
      dockerfile: Dockerfile
    environment:
      - DOCKER_BUILD=yas
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./temp:/temp
    depends_on:
      - pocketbase
      - telegram-bot-api
      - face-swap-component

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    environment:
      - DOCKER_BUILD=yas
    env_file:
      - .env
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped
    depends_on:
      - pocketbase
      - telegram-bot-api
