name: test-and-build

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [telegram-bot, job-manager]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - name: Test
        working-directory: ${{ matrix.component }}
        run: go test -race ./...
      - name: Vet
        working-directory: ${{ matrix.component }}
        run: go vet ./...

  test-face-swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Test bounded-memory pipeline
        working-directory: face-swap-component
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

  build-images:
    needs: [test-go, test-face-swap]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: telegram-bot
            context: ./telegram-bot
            file: ./telegram-bot/Dockerfile
            tag: latest
          - image: job-manager
            context: ./job-manager
            file: ./job-manager/Dockerfile
            tag: latest
          - image: pocketbase
            context: ./pocketbase
            file: ./pocketbase/Dockerfile
            tag: latest
          - image: face-swap
            context: ./face-swap-component
            file: ./face-swap-component/Dockerfile-cpu
            tag: latest-cpu
          - image: face-swap
            context: ./face-swap-component
            file: ./face-swap-component/Dockerfile-cuda
            tag: latest-cuda
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}/{1}/{2}:{3}', secrets.REGISTRY, github.repository_owner, matrix.image, matrix.tag) || format('local/{0}:{1}', matrix.image, matrix.tag) }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          provenance: false
